<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Verhuisd naar TaalHulp</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="1; url=https://taalhulp-fr.vercel.app/?scenario=shopping">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Mulish,Arial,sans-serif;color:#222;background:#fff;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:32px 16px}
h1{color:#800000;font-size:1.4rem;margin:0 0 12px}
a{color:#800000;font-weight:700}
</style>
</head>
<body>
<main>
<h1>Deze taalhulp is verhuisd naar TaalHulp</h1>
<p>U wordt automatisch doorgestuurd. Gebeurt dat niet, open dan <a id="link" href="https://taalhulp-fr.vercel.app/?scenario=shopping">TaalHulp</a>.</p>
</main>
<script>
(function(){
  var t="https://taalhulp-fr.vercel.app/?scenario=shopping";
  var framed=false;
  try{framed=window.self!==window.top;}catch(e){framed=true;}
  if(framed){t+=(t.indexOf("?")>-1?"&":"?")+"embed=1";}
  var l=document.getElementById("link");if(l){l.href=t;}
  var done=false;
  function go(){if(!done){done=true;location.replace(t);}}
  setTimeout(go,800);
  try{
    var p=[];
    if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations){
      p.push(navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.filter(function(r){return r.scope.indexOf(location.origin+"/Franse-taal-in-contextuele-module/")===0;}).map(function(r){return r.unregister();}));
      }));
    }
    if(window.caches&&caches.delete){p.push(caches.delete("nlfr-v1"));}
    Promise.all(p).then(go,go);
  }catch(e){go();}
})();
</script>
</body>
</html>
